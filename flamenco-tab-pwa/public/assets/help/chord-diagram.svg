<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-label="Diagrama del acorde LA Flamenco por medio">
  <rect width="360" height="330" fill="#ffffff"/>

  <text x="180" y="34" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">LA Flamenco (Por Medio)</text>
  <text x="180" y="54" font-size="12" fill="#64748b" text-anchor="middle">Bulerías · Tangos · Soleá por Bulerías</text>

  <!-- Marcas de cuerda al aire (O) y no tocar (X) -->
  <circle cx="112" cy="86" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="272" cy="86" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
  <g stroke="#dc2626" stroke-width="2.4" stroke-linecap="round">
    <line x1="64" y1="79" x2="78" y2="93"/>
    <line x1="78" y1="79" x2="64" y2="93"/>
  </g>

  <!-- Cejilla / cejuela -->
  <line x1="70" y1="104" x2="270" y2="104" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

  <!-- Cuerdas -->
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="70" y1="104" x2="70" y2="250"/>
    <line x1="110" y1="104" x2="110" y2="250"/>
    <line x1="150" y1="104" x2="150" y2="250"/>
    <line x1="190" y1="104" x2="190" y2="250"/>
    <line x1="230" y1="104" x2="230" y2="250"/>
    <line x1="270" y1="104" x2="270" y2="250"/>
  </g>

  <!-- Trastes -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="70" y1="140" x2="270" y2="140"/>
    <line x1="70" y1="176" x2="270" y2="176"/>
    <line x1="70" y1="212" x2="270" y2="212"/>
    <line x1="70" y1="248" x2="270" y2="248"/>
  </g>

  <!-- Números de traste -->
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="58" y="126">1</text>
    <text x="58" y="162">2</text>
    <text x="58" y="198">3</text>
    <text x="58" y="234">4</text>
  </g>

  <!-- Puntos (cuerdas 2, 3 y 4 en el traste 2) -->
  <g fill="#2563eb">
    <circle cx="230" cy="158" r="10"/>
    <circle cx="190" cy="158" r="10"/>
    <circle cx="150" cy="158" r="10"/>
  </g>

  <!-- Leyenda -->
  <text x="180" y="292" font-size="11" fill="#64748b" text-anchor="middle">O = cuerda al aire · X = no tocar · punto = traste pisado</text>
  <text x="180" y="312" font-size="11" fill="#64748b" text-anchor="middle">La 1ª cuerda (aguda) queda a la derecha</text>
</svg>
