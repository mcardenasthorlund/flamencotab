<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="Ejemplo de tablatura flamenca con números de traste, compases, ligadura, trémolo, rasgueo y flechas de dirección">
  <rect width="920" height="300" fill="#ffffff"/>
  <rect x="70" y="26" width="812" height="248" rx="10" fill="#fafafa" stroke="#e2e8f0"/>

  <!-- Números de cuerda -->
  <g fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">
    <text x="96" y="71">1</text>
    <text x="96" y="106">2</text>
    <text x="96" y="141">3</text>
    <text x="96" y="176">4</text>
    <text x="96" y="211">5</text>
    <text x="96" y="246">6</text>
  </g>

  <!-- Cuerdas (grosor creciente de la 1ª a la 6ª) -->
  <g stroke="#cbd5e1" stroke-linecap="round">
    <line x1="112" y1="67" x2="862" y2="67" stroke-width="1"/>
    <line x1="112" y1="102" x2="862" y2="102" stroke-width="1.6"/>
    <line x1="112" y1="137" x2="862" y2="137" stroke-width="2.2"/>
    <line x1="112" y1="172" x2="862" y2="172" stroke-width="2.8"/>
    <line x1="112" y1="207" x2="862" y2="207" stroke-width="3.4"/>
    <line x1="112" y1="242" x2="862" y2="242" stroke-width="4"/>
  </g>

  <!-- Notas: rectángulo blanco + cifra -->
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <!-- columna 1 -->
    <rect x="180" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="190" y="70">0</text>
    <rect x="180" y="91" width="20" height="18" rx="3" fill="#ffffff"/><text x="190" y="105">2</text>
    <rect x="180" y="126" width="20" height="18" rx="3" fill="#ffffff"/><text x="190" y="140">2</text>
    <!-- columna 2 -->
    <rect x="272" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="282" y="70">3</text>
    <rect x="272" y="91" width="20" height="18" rx="3" fill="#ffffff"/><text x="282" y="105">1</text>
    <!-- columna 3 -->
    <rect x="372" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="382" y="70">0</text>
    <rect x="372" y="91" width="20" height="18" rx="3" fill="#ffffff"/><text x="382" y="105">0</text>
    <rect x="372" y="126" width="20" height="18" rx="3" fill="#ffffff"/><text x="382" y="140">1</text>
    <!-- trémolo (4 notas repetidas en la 1ª cuerda) -->
    <rect x="446" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="456" y="70">0</text>
    <rect x="486" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="496" y="70">0</text>
    <rect x="526" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="536" y="70">0</text>
    <rect x="566" y="56" width="20" height="18" rx="3" fill="#ffffff"/><text x="576" y="70">0</text>
  </g>

  <!-- Ligadura entre la columna 1 y la columna 2 (1ª cuerda) -->
  <path d="M 190 54 Q 236 26 282 54" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Compás -->
  <line x1="338" y1="34" x2="338" y2="260" stroke="#0f172a" stroke-width="2.4"/>
  <!-- Doble compás -->
  <line x1="636" y1="34" x2="636" y2="260" stroke="#0f172a" stroke-width="2.4"/>
  <line x1="644" y1="34" x2="644" y2="260" stroke="#0f172a" stroke-width="4"/>

  <!-- Rasgueo (flecha con ondulación) -->
  <path d="M 700 236 C 712 226 688 216 700 206 C 712 196 688 186 700 176 C 712 166 688 156 700 146 C 712 136 688 126 700 116 C 712 106 688 96 700 86" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="700,70 691,88 709,88" fill="#2563eb"/>

  <!-- Flecha arriba -->
  <line x1="780" y1="236" x2="780" y2="86" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="780,70 771,88 789,88" fill="#2563eb"/>

  <!-- Flecha abajo -->
  <line x1="836" y1="70" x2="836" y2="220" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="836,236 827,218 845,218" fill="#2563eb"/>
</svg>
