<div class="ornament-toolbar">
  @for (btn of buttons; track btn.type; let i = $index) {
    @if (i > 0 && buttons[i - 1].group !== btn.group) {
      <span class="toolbar-sep"></span>
    }
    <button
      class="ornament-btn"
      [attr.title]="btn.label"
      [attr.aria-label]="btn.label"
      (click)="ornamentSelected.emit(btn.type)"
    >
      <span class="ornament-symbol">{{ btn.symbol }}</span>
      <span class="ornament-label">{{ btn.label }}</span>
    </button>
  }
  <span class="toolbar-sep"></span>
  <button
    class="ornament-btn ornament-btn-chord"
    title="Importar acorde"
    aria-label="Importar acorde"
    (click)="chordPicker.emit()"
  >
    <span class="ornament-symbol ornament-symbol-chord">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M12 21a9 9 0 1 0-9-9"/></svg>
    </span>
    <span class="ornament-label">Acorde</span>
  </button>
</div>
